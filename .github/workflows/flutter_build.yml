name: flutter_build
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Zip URL'
        required: true
        type: string
      tag:
        required: false
        type: string
      build_type:
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Download and Build
        run: |
          echo "Downloading ${{ inputs.zip_url }}"
          curl -L -o project.zip "${{ inputs.zip_url }}"
          unzip -o project.zip -d project
          cd project
          # cari folder flutter
          cd $(find . -name "pubspec.yaml" | head -1 | xargs dirname)
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "**/app-release.apk"
